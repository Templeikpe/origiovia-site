<!DOCTYPE html>
<html lang="en">
<!-- Page d'erreur 404 : Netlify l'affiche automatiquement quand une adresse n'existe pas.
     Les chemins sont ABSOLUS (commencent par /) car cette page peut s'afficher à n'importe quelle adresse.
     Page volontairement simple : sans menu ni script. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found — OrigoVia Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<link rel="icon" type="image/png" href="/assets/img/logo.jpeg">
</head>
<body>
<header id="siteHeader" class="solid">
  <div class="wrap navbar">
    <a href="/index.html" class="logo">
      <span class="logo-mark"><img src="/assets/img/logo.jpeg" alt="OrigoVia Partners"></span>
      OrigoVia Partners
    </a>
  </div>
</header>
<section style="min-height:100vh;display:flex;align-items:center;text-align:center;">
  <div class="wrap">
    <div class="eyebrow">Error 404</div>
    <h1 style="font-size:2.4rem;margin:12px 0;">This page could not be found.</h1>
    <p class="lead" style="margin-bottom:28px;">The address may be wrong or the page may have moved.</p>
    <a href="/index.html" class="btn btn-primary">Back to the homepage</a>
    <a href="/contact.html" class="btn btn-ghost" style="margin-left:10px;color:var(--navy);border-color:var(--navy);">Contact us</a>
  </div>
</section>
</body>
</html>
